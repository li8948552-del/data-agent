server:
  port: ${PORT:9933}

spring:
  application:
    name: data-agent
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/data_agent}
    username: ${DB_USER:data_agent}
    password: ${DB_PASSWORD:data_agent}

agent:
  llm:
    base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:gpt-5.6}
  embedding:
    model: ${EMBEDDING_MODEL:text-embedding-3-small}

management:
  endpoints:
    web:
      exposure:
        include: health,info
