services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: data_agent
      POSTGRES_USER: data_agent
      POSTGRES_PASSWORD: data_agent
    ports:
      - "5432:5432"
    volumes:
      - data_agent_pg:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  data_agent_pg:
